name: HR Portal CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/HR.slnx

      - name: Build Backend Solution
        run: dotnet build backend/HR.slnx --configuration Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test backend/tests/HR.UnitTests/HR.UnitTests.csproj --configuration Release --no-build --verbosity normal

  frontend-ci:
    name: Frontend Lint & Build (React 19 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build
